<div class="h-screen flex gap-6 p-6">
  <div class="w-64">
    <app-todo-form (todoAdd)="onTodoAdd($event)"/>
  </div>

  <div class="h-full border-r border-slate-400"></div>

  <div class=" flex flex-col flex-wrap gap-4">
    <app-title label="To Do List"/>

    <div class="flex gap-4">
      @for (todo of pageResult()?.results; track todo.id) {
        <app-todo-card
          [todo]="todo"
          (todoChange)="onTodoChange($event)"
        />
      }
    </div>
  </div>
</div>
